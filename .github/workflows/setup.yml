# Runs the README's steps on clean macOS and Ubuntu machines, then check.sh.
# A red run means an attendee following the README would hit the same problem.
# Sign-in (step 3) needs a person, so it is skipped here; installs are not.

name: setup

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *" # daily, to catch changes in the installers

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck check.sh

  readme-steps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: he-setup

      # Step 1. The runners already have git and curl. The Xcode tools on the
      # macOS runner are preinstalled, so xcode-select is not run.
      - name: Step 1, base tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      # Step 2. The runners preinstall several JDKs and set JAVA_HOME to one of
      # them, so after installing as the README says, point JAVA_HOME at 17.
      - name: Step 2, JDK 17 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openjdk-17-jdk
          jdk="$(ls -d /usr/lib/jvm/java-17-openjdk-* | head -n 1)"
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"

      - name: Step 2, JDK 17 (macOS)
        if: runner.os == 'macOS'
        run: |
          # The runner may already have Temurin 17 outside Homebrew, in which
          # case the cask refuses to overwrite it. java_home below still has
          # to find a 17, so a real failure still fails the job.
          brew install --cask temurin@17 || echo "cask install failed; checking for an existing JDK 17"
          jdk="$(/usr/libexec/java_home -v 17)"
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"

      - name: Step 3, Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Step 3, Codex
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.codex/bin" >> "$GITHUB_PATH"

      - name: Step 3, agents start
        run: |
          claude --version
          codex --version

      # Step 4. he-setup comes from this checkout, so the run tests the
      # pushed commit; the other two are cloned exactly as the README says.
      - name: Step 4, clone
        run: |
          mkdir -p ~/course
          cp -R he-setup ~/course/he-setup
          git clone https://github.com/qcon-he-course/he-tollgate.git ~/course/tollgate
          git clone https://github.com/qcon-he-course/he-petclinic.git ~/course/petclinic

      - name: Step 5, build Tollgate
        run: |
          cd ~/course/tollgate
          ./mvnw -B verify

      # macOS runs the check with /bin/bash, the 3.2 that ships with macOS,
      # because most attendees' Macs have no newer bash.
      - name: Step 7, check (Ubuntu)
        if: runner.os == 'Linux'
        run: bash ~/course/he-setup/check.sh

      - name: Step 7, check (macOS)
        if: runner.os == 'macOS'
        run: /bin/bash ~/course/he-setup/check.sh
